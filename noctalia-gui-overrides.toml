config_version = 14

[bar.default]
border = "tertiary"
border_width = 0.5
margin_ends = 0
radius = 6
radius_bottom_left = 0
radius_bottom_right = 0

[control_center]
width = 800

[location]
auto_locate = true

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@HDMI-A-1", "lockscreen-login-box@DP-2" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@DP-2"]
    box_height = 196.0
    box_width = 720.0
    cx = 1280.0
    cy = 1321.0
    output = "DP-2"
    placement_height = 1440.0
    placement_width = 2560.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@DP-2".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

    [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1"]
    box_height = 196.0
    box_width = 720.0
    cx = 960.0
    cy = 961.0
    output = "HDMI-A-1"
    placement_height = 1920.0
    placement_width = 1080.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[notification]
monitors = [ "DP-2" ]
position = "bottom_left"

[osd]
background_opacity = 0.79999998211860657
monitors = [ "DP-2" ]
offset_y = 150
position = "bottom_center"
position_vertical = "bottom_center"

[plugins]
enabled = []

[shell]
app_icon_color = "error"
corner_radius_scale = 0.5000000074505806
external_ip_enabled = true
font_family = "DejaVu Sans"
password_style = "random"
screen_time_enabled = true

    [shell.animation]
    speed = 1.700000025331974

    [shell.launcher]
    app_grid = true

    [shell.panel]
    control_center_placement = "floating"

    [shell.screenshot]
    pipe_command = "satty -f - -o \"$NOCTALIA_SCREENSHOT_PATH\""
    pipe_to_command = true

[system.monitor]
gpu_poll_seconds = 5

[theme]
builtin = "Ayu"
community_palette = "GitHub Dark"
mode = "dark"
source = "community"
wallpaper_scheme = "m3-content"

    [theme.templates]
    builtin_ids = [ "kitty" ]

[wallpaper]
directory = "/home/laughablehammer/Wallpapers"

    [wallpaper.default]
    path = "/home/laughablehammer/Wallpapers/shark.jpeg"

    [wallpaper.last]
    path = "color:#000000"

    [wallpaper.monitors.DP-2]
    path = "/home/laughablehammer/Wallpapers/shark.jpeg"

    [wallpaper.monitors.HDMI-A-1]
    path = "color:#000000"

[widget.battery]
enabled = false

[widget.brightness]
enabled = false

[widget.control-center]
enabled = false

[widget.media]
art_size = 30
font_weight = 400
hide_when_no_media = true
max_length = 269
title_scroll = "on_hover"

[widget.network]
show_label = false

[widget.tray]
enabled = false